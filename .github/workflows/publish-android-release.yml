name: Publish Android APK Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-android-release.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: winter-arc-android-v1-1-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d5a54c9969cacd3ed06dca7c09efe94c809af6e7
      - name: Download the verified APK
        uses: actions/download-artifact@v4
        with:
          name: winter-arc-debug-apk
          path: apk
          run-id: 37121954951
          github-token: ${{ github.token }}
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mv apk/app-debug.apk apk/winter-arc-v1.1.0.apk
          cd apk
          sha256sum winter-arc-v1.1.0.apk > SHA256SUMS.txt
          cp ../RELEASE_NOTES_1.1.0.md release-notes.md
          if gh release view v1.1.0-android > /dev/null 2>&1; then
            echo "Release already exists; leaving its assets unchanged."
            exit 0
          fi
          gh release create v1.1.0-android \
            --target d5a54c9969cacd3ed06dca7c09efe94c809af6e7 \
            --title "Winter Arc Android v1.1.0" \
            --prerelease \
            --notes-file release-notes.md \
            winter-arc-v1.1.0.apk SHA256SUMS.txt
